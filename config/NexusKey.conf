CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_PM_SOFT_OFF=y

# Enable logging and UART backend
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_SERIAL=y
CONFIG_UART_0_NRF_UARTE=y  # For nRF52840, UART 0 is usually UARTE

CONFIG_LOG_OVERRIDE_LEVEL=4  # Debug level logging for all modules
CONFIG_LOG_MODE_IMMEDIATE=y  # Print instantly

# Disable RTT
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_USE_SEGGER_RTT=n