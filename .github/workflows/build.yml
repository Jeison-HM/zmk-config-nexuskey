on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    steps:
      - name: Rename ELF Debug Artifact
        shell: sh -x {0}
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/zephyr.elf" ]
          then
            cp "${{ env.build_dir }}/zephyr/zephyr.elf" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.elf"
          elif [ -f "${{ env.build_dir }}/zephyr/zmk.elf" ]
          then
            cp "${{ env.build_dir }}/zephyr/zmk.elf" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.elf"
          fi